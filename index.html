<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dummy - Physics Sandbox</title>
    <!-- Importing Matter.js for advanced physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212; /* Dark majestic background */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Test Dummy Beta</h1>
        <p>Left Click & Drag to move dummy.</p>
        <p>Right Click to shoot a heavy weapon ball.</p>
    </div>

    <script>
        // --- Setup Matter.js ---
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Composites = Matter.Composites,
              MouseConstraint = Matter.MouseConstraint,
              Mouse = Matter.Mouse,
              Composite = Matter.Composite,
              Constraint = Matter.Constraint,
              Bodies = Matter.Bodies,
              Events = Matter.Events,
              Vector = Matter.Vector;

        const engine = Engine.create();
        const world = engine.world;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#121212'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // --- Build Boundaries ---
        const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight, window.innerWidth, 50, { isStatic: true, render: { fillStyle: '#333' } });
        const wallLeft = Bodies.rectangle(0, window.innerHeight / 2, 50, window.innerHeight, { isStatic: true, render: { fillStyle: '#333' } });
        const wallRight = Bodies.rectangle(window.innerWidth, window.innerHeight / 2, 50, window.innerHeight, { isStatic: true, render: { fillStyle: '#333' } });
        Composite.add(world, [ground, wallLeft, wallRight]);

        // --- Create "Test Dummy" Ragdoll ---
        function createDummy(x, y) {
            const headOptions = { friction: 0.8, restitution: 0.2, render: { fillStyle: '#e0e0e0' } };
            const torsoOptions = { friction: 0.8, restitution: 0.2, render: { fillStyle: '#c0c0c0' } };
            const limbOptions = { friction: 0.8, restitution: 0.2, render: { fillStyle: '#a0a0a0' } };

            const head = Bodies.circle(x, y - 60, 20, headOptions);
            const torso = Bodies.rectangle(x, y, 40, 80, torsoOptions);
            const leftArm = Bodies.rectangle(x - 35, y, 20, 60, limbOptions);
            const rightArm = Bodies.rectangle(x + 35, y, 20, 60, limbOptions);
            const leftLeg = Bodies.rectangle(x - 15, y + 70, 20, 60, limbOptions);
            const rightLeg = Bodies.rectangle(x + 15, y + 70, 20, 60, limbOptions);

            const dummyParts = [head, torso, leftArm, rightArm, leftLeg, rightLeg];
            dummyParts.forEach(part => part.isDummy = true); // Tag parts for collision detection

            const neck = Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 20 }, pointB: { x: 0, y: -40 }, stiffness: 0.8, render: { visible: false }});
            const leftShoulder = Constraint.create({ bodyA: torso, bodyB: leftArm, pointA: { x: -20, y: -30 }, pointB: { x: 0, y: -25 }, stiffness: 0.8, render: { visible: false }});
            const rightShoulder = Constraint.create({ bodyA: torso, bodyB: rightArm, pointA: { x: 20, y: -30 }, pointB: { x: 0, y: -25 }, stiffness: 0.8, render: { visible: false }});
            const leftHip = Constraint.create({ bodyA: torso, bodyB: leftLeg, pointA: { x: -10, y: 40 }, pointB: { x: 0, y: -25 }, stiffness: 0.8, render: { visible: false }});
            const rightHip = Constraint.create({ bodyA: torso, bodyB: rightLeg, pointA: { x: 10, y: 40 }, pointB: { x: 0, y: -25 }, stiffness: 0.8, render: { visible: false }});

            Composite.add(world, [...dummyParts, neck, leftShoulder, rightShoulder, leftHip, rightHip]);
        }

        createDummy(window.innerWidth / 2, window.innerHeight / 2);

        // --- Mouse Interaction ---
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);
        render.mouse = mouse;

        // --- Weapon System & Gore Physics ---
        // Right click to shoot a weapon
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const startX = 0;
            const startY = e.clientY;
            const bullet = Bodies.circle(startX, startY, 15, {
                density: 0.05, // Heavy impact
                frictionAir: 0.01,
                restitution: 0.5,
                render: { fillStyle: '#ffcc00' }
            });
            
            // Calculate velocity towards mouse
            const forceX = (e.clientX - startX) * 0.05;
            const forceY = (e.clientY - startY) * 0.05;
            
            Matter.Body.setVelocity(bullet, { x: forceX, y: forceY });
            Composite.add(world, bullet);
        });

        // Custom Particle System for "Blood/Gore"
        let particles = [];
        
        function spawnGore(x, y, intensity) {
            const particleCount = Math.min(Math.floor(intensity * 2), 30); // Cap particles to prevent lag
            for (let i = 0; i < particleCount; i++) {
                const particle = Bodies.circle(x, y, Math.random() * 4 + 2, {
                    friction: 0.1,
                    restitution: 0.1,
                    isSensor: true, // Don't collide with other particles heavily
                    render: { fillStyle: '#8a0303' } // Dark blood red
                });
                
                // Explode outward
                const velocity = {
                    x: (Math.random() - 0.5) * intensity,
                    y: (Math.random() - 0.5) * intensity
                };
                Matter.Body.setVelocity(particle, velocity);
                
                Composite.add(world, particle);
                
                // Remove particle after a few seconds to save memory
                setTimeout(() => {
                    Composite.remove(world, particle);
                }, 3000 + Math.random() * 2000);
            }
        }

        // Listen for impacts
        Events.on(engine, 'collisionStart', function(event) {
            const pairs = event.pairs;
            
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                // Check if dummy was hit
                if (bodyA.isDummy || bodyB.isDummy) {
                    // Calculate impact speed based on velocity difference
                    const velocityA = bodyA.velocity;
                    const velocityB = bodyB.velocity;
                    const relativeVelocity = Vector.magnitude(Vector.sub(velocityA, velocityB));
                    
                    // If the impact is hard enough, spawn gore particles
                    if (relativeVelocity > 5) {
                        const collisionPoint = pairs[i].collision.supports[0] || bodyA.position;
                        spawnGore(collisionPoint.x, collisionPoint.y, relativeVelocity);
                    }
                }
            }
        });

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            Matter.Body.setPosition(ground, { x: window.innerWidth / 2, y: window.innerHeight });
            Matter.Body.setPosition(wallRight, { x: window.innerWidth, y: window.innerHeight / 2 });
        });
    </script>
</body>
</html>
